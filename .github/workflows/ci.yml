name: SDK validation

on:
  push:
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - AGENTS.md
      - CLAUDE.md
      - GEMINI.md
      - LICENSE
      - dev/**
      - docs/**
      - examples/**
      - .agents/**
      - .claude/**
      - .codex/**
      - .entire/**
      - .gemini/**
      - .github/ISSUE_TEMPLATE/**
      - .gitignore
      - .readthedocs.yaml
  pull_request:
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - AGENTS.md
      - CLAUDE.md
      - GEMINI.md
      - LICENSE
      - dev/**
      - docs/**
      - examples/**
      - .agents/**
      - .claude/**
      - .codex/**
      - .entire/**
      - .gemini/**
      - .github/ISSUE_TEMPLATE/**
      - .gitignore
      - .readthedocs.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.15'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: |
          python -m pip install 'poetry==2.4.2'
          poetry check --lock --strict
          poetry install --no-interaction
      - name: Offline tests including native permissions and spawned processes
        run: poetry run pytest -q
      - name: Build and verify the installed wheel
        run: |
          poetry build
          poetry run python -m pip install --force-reinstall --no-deps dist/*.whl
          poetry run python tests/package_smoke.py
      - name: Rehearse offline recovery in a clean wheel environment
        run: |
          python -m venv "$RUNNER_TEMP/pat-recovery-venv"
          recovery_python="$RUNNER_TEMP/pat-recovery-venv/bin/python"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            recovery_python="$RUNNER_TEMP/pat-recovery-venv/Scripts/python.exe"
          fi
          "$recovery_python" -I -m pip install dist/*.whl
          "$recovery_python" -I -m pip check
          "$recovery_python" -I tests/pat_recovery_rehearsal.py \
            --wheel dist/sfdctrust-*.whl \
            --source-commit "$(git rev-parse HEAD)" \
            --source-branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" \
            --source-state "hosted checkout; git status follows"
          git status --short --branch

  quality:
    name: Lint, packaging, and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked tooling
        run: |
          python -m pip install 'poetry==2.4.2'
          poetry install --with docs --no-interaction
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run bandit -r src -q
      - run: poetry build
      - run: poetry run twine check --strict dist/*
      - run: poetry run sphinx-build -W --keep-going -E -a -b html docs docs/_build/html
