name: SDK validation

# Deliberately unfiltered: required checks must also complete on docs-only/fork PRs.
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

jobs:
  metadata:
    name: Supported Python policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - id: matrix
        run: |
          policy_matrix="$(python tools/ci/matrix.py)"
          echo "matrix=$policy_matrix" >> "$GITHUB_OUTPUT"

  tests:
    needs: metadata
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: |
          python -m pip install 'poetry==2.5.1'
          poetry check --lock --strict
          poetry install --no-interaction
      - name: Offline tests including native permissions and spawned processes
        run: poetry run python tests/offline/run.py -m pytest -q
      - name: Build and verify the installed wheel
        run: |
          poetry build
          poetry run python -m pip install --force-reinstall --no-deps dist/*.whl
          poetry run python tests/offline/run.py tests/package_smoke.py
      - name: Rehearse offline recovery in a clean wheel environment
        run: |
          python -m venv "$RUNNER_TEMP/pat-recovery-venv"
          recovery_python="$RUNNER_TEMP/pat-recovery-venv/bin/python"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            recovery_python="$RUNNER_TEMP/pat-recovery-venv/Scripts/python.exe"
          fi
          "$recovery_python" -I -m pip install dist/*.whl
          "$recovery_python" -I -m pip check
          "$recovery_python" -I tests/pat_recovery_rehearsal.py \
            --wheel dist/sfdctrust-*.whl \
            --source-commit "$(git rev-parse HEAD)" \
            --source-branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" \
            --source-state "hosted checkout; git status follows"
          git status --short --branch

  quality:
    name: Lint, packaging, and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked tooling
        run: |
          python -m pip install 'poetry==2.5.1'
          poetry check --lock --strict
          poetry install --with docs --no-interaction
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run bandit -r src -q
      - run: poetry build
      - run: poetry run twine check --strict dist/*
      - name: Inspect wheel and sdist against source
        run: poetry run python tools/ci/artifacts.py inspect --manifest "$RUNNER_TEMP/release-manifest.json"
      - name: Retrieve locked artifact-qualification dependencies (network allowed)
        run: >-
          poetry run python tools/ci/qualify.py prepare
          --wheelhouse "$RUNNER_TEMP/artifact-wheels" --work "$RUNNER_TEMP/artifact-checks"
      - name: Qualify separate non-editable wheel and sdist installations (offline)
        run: >-
          poetry run python tools/ci/qualify.py qualify
          --wheelhouse "$RUNNER_TEMP/artifact-wheels" --work "$RUNNER_TEMP/artifact-checks"
      - run: poetry run sphinx-build -W --keep-going -E -a -b html docs docs/_build/html

  compatibility:
    name: Public compatibility and downstream typing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare wheels and isolated non-editable installations
        run: |
          python -m pip install 'poetry==2.5.1'
          poetry check --lock --strict
          poetry install --no-interaction
          poetry build
          compat_root="$RUNNER_TEMP/compatibility"
          mkdir -p "$compat_root/wheels" "$compat_root/evidence"
          checker_version="$(poetry run python -c 'from importlib.metadata import version; print(version("mypy"))')"
          python -m pip download --only-binary=:all: --dest "$compat_root/wheels" \
            'sfdctrust==0.2.0' "mypy==$checker_version"
          python -m venv "$compat_root/baseline"
          python -m venv "$compat_root/candidate"
          "$compat_root/baseline/bin/python" -I -m pip install --no-index --find-links "$compat_root/wheels" \
            "$compat_root/wheels/sfdctrust-0.2.0-py3-none-any.whl"
          "$compat_root/candidate/bin/python" -I -m pip install --no-index --find-links "$compat_root/wheels" \
            dist/sfdctrust-*.whl "mypy==$checker_version"
          "$compat_root/baseline/bin/python" -I -m pip check
          "$compat_root/candidate/bin/python" -I -m pip check
      - name: Compare public inventories and offline behavior, then reopen baseline stores
        run: |
          compat_root="$RUNNER_TEMP/compatibility"
          candidate_version="$(poetry run python -c 'from importlib.metadata import version; print(version("sfdctrust"))')"
          "$compat_root/baseline/bin/python" -I tests/compatibility/check_wheel.py \
            --wheel "$compat_root/wheels/sfdctrust-0.2.0-py3-none-any.whl" --expected-version 0.2.0 \
            --snapshot tests/compatibility/public-api.json --evidence "$compat_root/evidence/baseline.json"
          "$compat_root/candidate/bin/python" -I tests/compatibility/check_wheel.py \
            --wheel dist/sfdctrust-*.whl --expected-version "$candidate_version" \
            --snapshot tests/compatibility/public-api.json --evidence "$compat_root/evidence/candidate.json"
          "$compat_root/baseline/bin/python" -I tests/compatibility/check_wheel.py \
            --wheel "$compat_root/wheels/sfdctrust-0.2.0-py3-none-any.whl" --expected-version 0.2.0 \
            --snapshot tests/compatibility/public-api.json --mode seed --store-directory "$compat_root/stores" \
            --evidence "$compat_root/evidence/seed.json"
          "$compat_root/candidate/bin/python" -I tests/compatibility/check_wheel.py \
            --wheel dist/sfdctrust-*.whl --expected-version "$candidate_version" \
            --snapshot tests/compatibility/public-api.json --mode upgrade --store-directory "$compat_root/stores" \
            --evidence "$compat_root/evidence/upgrade.json"
          git rev-parse HEAD
          git status --short --branch
      - name: Type-check the downstream fixture against the installed candidate
        run: |
          compat_root="$RUNNER_TEMP/compatibility"
          "$compat_root/candidate/bin/python" -I -m mypy --version
          "$compat_root/candidate/bin/python" -I -m mypy --config-file tests/compatibility/mypy.ini \
            --no-incremental tests/compatibility/downstream.py

  audit:
    name: Locked runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked audit tooling
        run: |
          python -m pip install 'poetry==2.5.1'
          poetry check --lock --strict
          poetry install --no-interaction
      - name: Scan all locked runtime variants (advisory networking allowed)
        run: poetry run python tools/ci/audit.py --output "$RUNNER_TEMP/audit.json"
      - name: Retain complete audit disposition, including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: runtime-audit
          path: ${{ runner.temp }}/audit.json
          if-no-files-found: error
          retention-days: 30
