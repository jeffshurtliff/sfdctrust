name: SDK validation

# Deliberately unfiltered: required checks must also complete on docs-only/fork PRs.
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

jobs:
  metadata:
    name: Supported Python policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - id: matrix
        run: |
          policy_matrix="$(python tools/ci/matrix.py)"
          echo "matrix=$policy_matrix" >> "$GITHUB_OUTPUT"

  tests:
    needs: metadata
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: |
          python -m pip install 'poetry==2.5.1'
          poetry check --lock --strict
          poetry install --extras mcp --no-interaction
      - name: Offline tests including native permissions and spawned processes
        run: poetry run python tests/offline/run.py -m pytest -q
      - name: Build and verify the installed wheel
        run: |
          poetry build
          poetry run python -m pip install --force-reinstall --no-deps dist/*.whl
          poetry run python tests/offline/run.py tests/package_smoke.py
          poetry run python tests/offline/run.py tests/offline/mcp_qualification.py
      - name: Rehearse offline recovery in a clean wheel environment
        run: |
          python -m venv "$RUNNER_TEMP/pat-recovery-venv"
          recovery_python="$RUNNER_TEMP/pat-recovery-venv/bin/python"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            recovery_python="$RUNNER_TEMP/pat-recovery-venv/Scripts/python.exe"
          fi
          "$recovery_python" -I -m pip install dist/*.whl
          "$recovery_python" -I -m pip check
          "$recovery_python" -I tests/pat_recovery_rehearsal.py \
            --wheel dist/sfdctrust-*.whl \
            --source-commit "$(git rev-parse HEAD)" \
            --source-branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" \
            --source-state "hosted checkout; git status follows"
          git status --short --branch

  quality:
    name: Lint, packaging, and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked tooling
        run: |
          python -m pip install 'poetry==2.5.1'
          poetry check --lock --strict
          poetry install --extras mcp --with docs --no-interaction
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run bandit -r src -q
      - run: poetry build
      - run: poetry run twine check --strict dist/*
      - name: Inspect wheel and sdist against source
        run: poetry run python tools/ci/artifacts.py inspect --manifest "$RUNNER_TEMP/release-manifest.json"
      - name: Retrieve locked artifact-qualification dependencies (network allowed)
        run: >-
          poetry run python tools/ci/qualify.py prepare
          --wheelhouse "$RUNNER_TEMP/artifact-wheels" --work "$RUNNER_TEMP/artifact-checks"
      - name: Qualify separate non-editable wheel and sdist installations (offline)
        run: >-
          poetry run python tools/ci/qualify.py qualify
          --wheelhouse "$RUNNER_TEMP/artifact-wheels" --work "$RUNNER_TEMP/artifact-checks"
      - run: poetry run sphinx-build -W --keep-going -E -a -b html docs docs/_build/html

  compatibility:
    name: Public compatibility and downstream typing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Retrieve locked candidate and published baseline wheels (network allowed)
        run: |
          python -m pip install 'poetry==2.5.1'
          poetry check --lock --strict
          poetry install --extras mcp --no-interaction
          poetry build
          compat_root="$RUNNER_TEMP/compatibility"
          poetry run python tools/ci/qualify.py prepare \
            --wheelhouse "$compat_root/wheels" --work "$compat_root/retrieval"
          # Separate requests: pip cannot resolve two versions of one distribution together.
          for baseline in 0.2.0 1.0.0 1.1.0; do
            python -m pip download --only-binary=:all: --no-deps --dest "$compat_root/wheels" \
              "sfdctrust==$baseline"
          done
      - name: Install isolated baseline and candidate environments (offline)
        run: |
          compat_root="$RUNNER_TEMP/compatibility"
          checker_version="$(poetry run python -c 'from importlib.metadata import version; print(version("mypy"))')"
          for baseline in 0.2.0 1.0.0 1.1.0; do
            campaign="$compat_root/$baseline"
            mkdir -p "$campaign/evidence"
            python -m venv "$campaign/baseline"
            python -m venv "$campaign/candidate"
            "$campaign/baseline/bin/python" -I -m pip install --no-index --find-links "$compat_root/wheels" \
              --constraint "$compat_root/wheels/locked-active.txt" \
              "$compat_root/wheels/sfdctrust-$baseline-py3-none-any.whl"
            "$campaign/candidate/bin/python" -I -m pip install --no-index --find-links "$compat_root/wheels" \
              --constraint "$compat_root/wheels/locked-active.txt" dist/sfdctrust-*.whl "mypy==$checker_version"
            for role in baseline candidate; do
              "$campaign/$role/bin/python" -I -m pip check
              "$campaign/$role/bin/python" -I -m pip freeze > "$campaign/evidence/$role-freeze.txt"
            done
          done
      - name: Compare all public baselines and reopen their separate ready and pending stores (offline)
        run: |
          compat_root="$RUNNER_TEMP/compatibility"
          candidate_version="$(poetry run python -c 'from importlib.metadata import version; print(version("sfdctrust"))')"
          for baseline in 0.2.0 1.0.0 1.1.0; do
            campaign="$compat_root/$baseline"
            if [[ "$baseline" == "1.1.0" ]]; then
              "$campaign/baseline/bin/python" -I tests/offline/run.py tests/package_smoke.py
            fi
            "$campaign/baseline/bin/python" -I tests/compatibility/check_wheel.py \
              --wheel "$compat_root/wheels/sfdctrust-$baseline-py3-none-any.whl" --expected-version "$baseline" \
              --snapshot tests/compatibility/public-api.json --evidence "$campaign/evidence/baseline.json"
            "$campaign/candidate/bin/python" -I tests/compatibility/check_wheel.py \
              --wheel dist/sfdctrust-*.whl --expected-version "$candidate_version" \
              --snapshot tests/compatibility/public-api.json --evidence "$campaign/evidence/candidate.json"
            "$campaign/baseline/bin/python" -I tests/compatibility/check_wheel.py \
              --wheel "$compat_root/wheels/sfdctrust-$baseline-py3-none-any.whl" --expected-version "$baseline" \
              --snapshot tests/compatibility/public-api.json --mode seed --store-directory "$campaign/stores" \
              --evidence "$campaign/evidence/seed.json"
            "$campaign/candidate/bin/python" -I tests/compatibility/check_wheel.py \
              --wheel dist/sfdctrust-*.whl --expected-version "$candidate_version" \
              --snapshot tests/compatibility/public-api.json --mode upgrade --store-directory "$campaign/stores" \
              --evidence "$campaign/evidence/upgrade.json"
          done
          git rev-parse HEAD
          git status --short --branch
      - name: Type-check each installed candidate (offline)
        run: |
          compat_root="$RUNNER_TEMP/compatibility"
          for baseline in 0.2.0 1.0.0 1.1.0; do
            "$compat_root/$baseline/candidate/bin/python" -I tests/offline/run.py -m mypy --version
            "$compat_root/$baseline/candidate/bin/python" -I tests/offline/run.py -m mypy \
              --config-file tests/compatibility/mypy.ini --no-incremental tests/compatibility/downstream.py
          done
      - name: Retain compatibility campaigns, including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: public-compatibility
          path: ${{ runner.temp }}/compatibility/*/evidence/
          if-no-files-found: error
          retention-days: 30

  audit:
    name: Locked runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked audit tooling
        run: |
          python -m pip install 'poetry==2.5.1'
          poetry check --lock --strict
          poetry install --no-interaction
      - name: Scan all locked runtime variants (advisory networking allowed)
        run: poetry run python tools/ci/audit.py --output "$RUNNER_TEMP/audit.json"
      - name: Retain complete audit disposition, including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: runtime-audit
          path: ${{ runner.temp }}/audit.json
          if-no-files-found: error
          retention-days: 30
