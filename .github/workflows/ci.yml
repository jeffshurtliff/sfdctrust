name: SDK validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.15'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: |
          python -m pip install 'poetry==2.4.2'
          poetry check --lock --strict
          poetry install --no-interaction
      - name: Offline tests including native permissions and spawned processes
        run: poetry run pytest -q
      - name: Build and verify the installed wheel
        run: |
          poetry build
          poetry run python -m pip install --force-reinstall --no-deps dist/*.whl
          poetry run python tests/package_smoke.py

  quality:
    name: Lint, packaging, and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked tooling
        run: |
          python -m pip install 'poetry==2.4.2'
          poetry install --with docs --no-interaction
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run bandit -r src -q
      - run: poetry build
      - run: poetry run twine check --strict dist/*
      - run: poetry run sphinx-build -W --keep-going -E -a -b html docs docs/_build/html
