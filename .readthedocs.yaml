# Read the Docs configuration v2:
# https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      # Install from poetry.lock with the same Poetry version used locally.
      - python -m pip install "poetry==2.5.1"
      - poetry check --lock --strict
      # Install the package and its runtime dependencies so autodoc can import it.
      - VIRTUAL_ENV="$READTHEDOCS_VIRTUALENV_PATH" poetry install --only main,docs --no-interaction

sphinx:
  configuration: docs/conf.py
  builder: html
  fail_on_warning: true
