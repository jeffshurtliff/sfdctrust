# --------------------------------------------------------------------
# Core Project Configuration
# --------------------------------------------------------------------
[project]
name = "sfdctrust"
version = "1.0.0.dev0"
description = "Unofficial Python SDK for the Salesforce My Trust Center API"
readme = "README.md"
authors = [
    { name = "Jeff Shurtliff", email = "jeff@shurt.us" }
]
maintainers = [
    { name = "Jeff Shurtliff", email = "jeff@shurt.us" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["salesforce", "sfdc", "trust", "uptime", "api", "rest", "tooling", "python"]

classifiers = [
    # Project Maturity
    "Development Status :: 5 - Production/Stable",

    # Intended audience and environment
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Systems Administration",

    # Supported Python versions
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

dependencies = [
    "httpx (>=0.28.1,<1.0.0)",
    "pydantic (==2.14.3)",
]

[project.urls]
Documentation = "https://sfdctrust.readthedocs.io/en/stable/"
Changelog = "https://sfdctrust.readthedocs.io/en/latest/CHANGELOG.html"
Repository = "https://github.com/jeffshurtliff/sfdctrust"
Issues = "https://github.com/jeffshurtliff/sfdctrust/issues"

[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------
# Poetry-specific Configuration
# --------------------------------------------------------------------
[tool.poetry]
requires-poetry = ">=2.2,<3.0"
packages = [{ include = "sfdctrust", from = "src" }]
include = [
    { path = "poetry.lock", format = "sdist" },
    { path = "docs/CHANGELOG.md", format = "sdist" },
    { path = "docs/API_CONTRACT.md", format = "sdist" },
    { path = "tests", format = "sdist" },
    { path = "tools/ci", format = "sdist" },
    { path = "CONTRIBUTING.md", format = "sdist" },
    { path = "src/sfdctrust/py.typed", format = "sdist" },
]
exclude = [
    "dev", "local", ".env", ".env.*", "*.key", "**/*.key", "scratch.txt", "**/scratch.txt",
    "tempCodeRunnerFile.py", "**/tempCodeRunnerFile.py", "**/__pycache__", "**/*.pyc",
    "**/.DS_Store", "**/._*", ".venv", "dist", "build", "docs/_build",
    "**/*.sqlite3", "**/*.sqlite3-journal", "**/*.sqlite3-wal", "**/*.sqlite3-shm",
]

[tool.poetry.group.docs]
optional = true

[tool.ruff]
line-length = 130
target-version = "py312"
# Historical concept scripts are reference material, outside application/test lint scope
extend-exclude = ["dev"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Preserve the UTF-8 declaration in module headers
ignore = ["UP009"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit", "tests/integration"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["sfdctrust"]
branch = true

[dependency-groups]
dev = [
    "pytest (>=8.4,<10)",
    "coverage (>=7.10,<8)",
    "ruff (>=0.13,<1)",
    "bandit (>=1.8,<2)",
    "twine (>=6.2,<7)",
    "poetry-core (>=2.2,<3) ; python_version >= \"3.12\" and python_version < \"4.0\"",
    "pytest-asyncio (>=1,<2)",
    "mypy (>=1.19,<2)",
    "pip-audit (>=2.10,<3) ; python_version == \"3.12\"",
    "pypi-attestations (>=0.0.27,<1) ; python_version == \"3.12\"",
    "packaging (>=24)",
]
docs = [
    "sphinx (>=9.1,<10)",
    "myst-parser (>=4,<6)",
    "pydata-sphinx-theme (>=0.16,<0.23)",
    "sphinx-favicon (>=1.1,<2)",
]
